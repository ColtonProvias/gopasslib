version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - funlen
    - goconst
    - godox
    - gomodguard
    - ireturn
    - lll
    - mnd
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
      package-average: 0
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G115
    paralleltest:
      ignore-missing: true
